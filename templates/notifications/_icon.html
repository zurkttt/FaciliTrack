{% if n.level == "CRITICAL" %}<i class="bi bi-exclamation-octagon-fill notif-icon text-danger" aria-label="Critical"></i>{% elif n.level == "WARNING" %}<i class="bi bi-exclamation-triangle-fill notif-icon" style="color: #c4592f;" aria-label="Warning"></i>{% elif n.level == "SUCCESS" %}<i class="bi bi-check-circle-fill notif-icon text-success" aria-label="Success"></i>{% else %}<i class="bi bi-info-circle-fill notif-icon text-primary" aria-label="Info"></i>{% endif %}
