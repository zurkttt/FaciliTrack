{% if facility.status == "AVAILABLE" %}<span class="status-tag status-ok"><i class="bi bi-check-circle" aria-hidden="true"></i>Available</span>{% elif facility.status == "MAINTENANCE" %}<span class="status-tag status-warn"><i class="bi bi-tools" aria-hidden="true"></i>Under maintenance</span>{% else %}<span class="status-tag status-off"><i class="bi bi-slash-circle" aria-hidden="true"></i>{{ facility.get_status_display }}</span>{% endif %}{% if not facility.is_active %} <span class="status-tag status-off"><i class="bi bi-archive" aria-hidden="true"></i>Deactivated</span>{% endif %}
