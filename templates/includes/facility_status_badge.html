{% if facility.status == "AVAILABLE" %}<span class="badge text-bg-success">{{ facility.get_status_display }}</span>{% elif facility.status == "MAINTENANCE" %}<span class="badge text-bg-warning">{{ facility.get_status_display }}</span>{% else %}<span class="badge text-bg-secondary">{{ facility.get_status_display }}</span>{% endif %}{% if not facility.is_active %} <span class="badge text-bg-dark">Inactive</span>{% endif %}
